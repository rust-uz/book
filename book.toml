[book]
authors = ["Rust Uzbekistan Community", "Ibrohim Miraxmedov"]
language = "uz"
src = "src"
title = "Rust Dasturlash Tili (The Rust Programming Language)"
description = "Rasmiy 'The Rust Programming Language' kitobining o‘zbek tilidagi mukammal ochiq manbali tarjimasi | doc.ferris.uz"

[output.html]
git-repository-url = "https://github.com/rust-uz/book"
edit-url-template = "https://github.com/rust-uz/book/edit/main/{path}"
default-theme = "navy"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
